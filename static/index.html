<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Q&A</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #12181f;
    --border: #232b33;
    --text: #d8dee4;
    --muted: #8b98a5;
    --accent: #4fd1a5;
    --accent-dim: #2a7a5c;
    --user-bubble: #1b2733;
    --answer-bubble: #12211c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    height: 100vh;
  }

  /* Sidebar: document upload + list */
  .sidebar {
    width: 300px;
    min-width: 260px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px;
  }
  .sidebar h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .sidebar .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 20px;
  }

  .drop-zone {
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 24px 12px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease;
    font-size: 13px;
    color: var(--muted);
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    color: var(--text);
  }
  .drop-zone input { display: none; }

  .upload-status {
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--muted);
    min-height: 18px;
  }

  .doc-list {
    margin-top: 22px;
    overflow-y: auto;
    flex: 1;
  }
  .doc-list .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .doc-item {
    font-size: 13px;
    padding: 7px 10px;
    background: rgba(255,255,255,0.03);
    border-radius: 6px;
    margin-bottom: 6px;
    word-break: break-word;
  }
  .chunk-count {
    font-size: 12px;
    color: var(--muted);
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  /* Main chat area */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 32px 20% 20px;
  }
  @media (max-width: 900px) {
    .chat { padding: 24px 16px; }
  }

  .empty-state {
    color: var(--muted);
    font-size: 14px;
    margin-top: 60px;
    text-align: center;
    line-height: 1.6;
  }

  .msg {
    max-width: 100%;
    margin-bottom: 18px;
    line-height: 1.55;
    font-size: 14.5px;
  }
  .msg .role {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    border-radius: 10px;
    padding: 10px 14px;
    display: inline-block;
  }
  .msg.answer .bubble {
    background: var(--answer-bubble);
    border: 1px solid rgba(79,209,165,0.15);
    border-radius: 10px;
    padding: 12px 14px;
    white-space: pre-wrap;
  }
  .sources {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .sources span {
    background: rgba(79,209,165,0.08);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 100px;
    margin-right: 6px;
    display: inline-block;
    margin-top: 4px;
  }

  .input-bar {
    border-top: 1px solid var(--border);
    padding: 16px 20%;
    display: flex;
    gap: 10px;
  }
  @media (max-width: 900px) {
    .input-bar { padding: 14px 16px; }
  }
  .input-bar input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .input-bar input:focus { border-color: var(--accent-dim); }
  .input-bar button {
    background: var(--accent);
    color: #06120d;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .input-bar button:disabled {
    background: var(--accent-dim);
    cursor: not-allowed;
  }

  .thinking { color: var(--muted); font-style: italic; font-size: 13.5px; }
</style>
</head>
<body>

<div class="sidebar">
  <h1>Document Q&amp;A</h1>
  <p class="subtitle">Upload PDFs or text files, then ask questions about them.</p>

  <label class="drop-zone" id="dropZone">
    Click to choose a file, or drag one here<br>(.pdf or .txt)
    <input type="file" id="fileInput" accept=".pdf,.txt">
  </label>
  <div class="upload-status" id="uploadStatus"></div>

  <div class="doc-list">
    <div class="label">Indexed documents</div>
    <div id="docItems"></div>
  </div>

  <div class="chunk-count" id="chunkCount">0 chunks indexed</div>
</div>

<div class="main">
  <div class="chat" id="chat">
    <div class="empty-state" id="emptyState">
      Upload a document on the left, then ask a question about it below.
    </div>
  </div>

  <div class="input-bar">
    <input type="text" id="questionInput" placeholder="Ask a question about your documents..." />
    <button id="askBtn">Ask</button>
  </div>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const uploadStatus = document.getElementById('uploadStatus');
const docItems = document.getElementById('docItems');
const chunkCount = document.getElementById('chunkCount');
const chat = document.getElementById('chat');
const emptyState = document.getElementById('emptyState');
const questionInput = document.getElementById('questionInput');
const askBtn = document.getElementById('askBtn');

async function refreshStatus() {
  try {
    const res = await fetch('/status');
    const data = await res.json();
    chunkCount.textContent = `${data.total_chunks} chunk${data.total_chunks === 1 ? '' : 's'} indexed`;
    docItems.innerHTML = data.documents.map(d => `<div class="doc-item">${d}</div>`).join('');
  } catch (e) {
    console.error('Status fetch failed', e);
  }
}

async function uploadFile(file) {
  uploadStatus.textContent = `Uploading "${file.name}"...`;
  const formData = new FormData();
  formData.append('file', file);
  try {
    const res = await fetch('/upload', { method: 'POST', body: formData });
    const data = await res.json();
    uploadStatus.textContent = data.message;
    refreshStatus();
  } catch (e) {
    uploadStatus.textContent = 'Upload failed. Is the server running?';
  }
}

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) uploadFile(fileInput.files[0]);
});
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
});

function addMessage(role, text) {
  if (emptyState) emptyState.remove();
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (role === 'user') {
    div.innerHTML = `<div class="role">You</div><div class="bubble"></div>`;
    div.querySelector('.bubble').textContent = text;
  } else {
    div.innerHTML = `<div class="role">Answer</div><div class="bubble"></div>`;
    div.querySelector('.bubble').textContent = text;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function askQuestion() {
  const question = questionInput.value.trim();
  if (!question) return;

  addMessage('user', question);
  questionInput.value = '';
  askBtn.disabled = true;

  const thinkingDiv = document.createElement('div');
  thinkingDiv.className = 'msg thinking';
  thinkingDiv.textContent = 'Searching documents and generating an answer...';
  chat.appendChild(thinkingDiv);
  chat.scrollTop = chat.scrollHeight;

  try {
    const formData = new FormData();
    formData.append('question', question);
    const res = await fetch('/ask', { method: 'POST', body: formData });
    const data = await res.json();

    thinkingDiv.remove();
    const answerDiv = addMessage('answer', data.answer);
    if (data.sources && data.sources.length) {
      const sourcesEl = document.createElement('div');
      sourcesEl.className = 'sources';
      sourcesEl.innerHTML = data.sources.map(s => `<span>${s}</span>`).join('');
      answerDiv.appendChild(sourcesEl);
    }
  } catch (e) {
    thinkingDiv.textContent = 'Something went wrong. Check the terminal running the server.';
  } finally {
    askBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }
}

askBtn.addEventListener('click', askQuestion);
questionInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') askQuestion(); });

refreshStatus();
</script>

</body>
</html>
