apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledgeai
  namespace: knowledgeai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledgeai
  template:
    metadata:
      labels:
        app: knowledgeai
    spec:
      containers:
        - name: knowledgeai
          image: abintony/knowledgeai:11
          ports:
            - containerPort: 8000
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: knowledgeai-secrets
                  key: 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
