apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledgeai
  namespace: knowledgeai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: knowledgeai
  template:
    metadata:
      labels:
        app: knowledgeai
    spec:
      containers:
        - name: knowledgeai
          image: abintony/knowledgeai:11
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: knowledgeai-secrets
                  key: GROQ_API_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: knowledgeai-service
  namespace: knowledgeai
spec:
  type: LoadBalancer
  selector:
    app: knowledgeai
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
